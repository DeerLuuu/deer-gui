[package]
name = "deer-gui"
description = "deer-gui 门面 crate：一条 import 拿到运行时全部能力，并提供离屏渲染到 PNG 的便捷入口"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deer-layout.workspace = true
deer-gpu.workspace = true
deer-vk.workspace = true
# 窗口层是**可选**的：只有开 `window` feature 才会把 winit 拉进来，
# 这样「只用离屏渲染 / 布局」的使用者不会被动拿到第三方依赖。
deer-window = { workspace = true, optional = true }

[features]
default = []
# 真窗口预览（M2b）：`cargo run -p deer-gui --features window --example window_preview`
window = ["dep:deer-window"]

[[example]]
name = "window_preview"
required-features = ["window"]

[[example]]
name = "hal_window_path"
required-features = ["window"]

# M3c：上屏像素 vs CPU 的逐像素对照（读回最后一帧）。同样是窗口路径 ⇒ 必须要 window feature，
# 也必须是 example 而不是 `#[test]`（winit 要求主线程，见 hal_window_path.rs 的说明）。
[[example]]
name = "window_parity"
required-features = ["window"]

# M5-4：输入 → 命中 → 状态 → 重绘的闭环（真窗口 + 脚本化重放）。窗口路径 ⇒ 要 window feature；
# 必须显式写 `required-features`，否则默认（无 feature）构建会去编译它而失败
# —— 那不是「跳过」，是 `cargo test --workspace` 直接红。
[[example]]
name = "interactive_form"
required-features = ["window"]

# 上手教程的主角（`docs/GETTING-STARTED-UI.md`）：最小但有真功能的交互界面。
# 同样是窗口路径 ⇒ 必须显式写 `required-features`，否则 `cargo test --workspace` 直接红
# （理由与上面 interactive_form 那段逐字相同）。
[[example]]
name = "counter"
required-features = ["window"]

[lib]
name = "deer_gui"
path = "src/lib.rs"
