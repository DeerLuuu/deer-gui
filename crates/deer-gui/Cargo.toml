[package]
name = "deer-gui"
description = "deer-gui 门面 crate：一条 import 拿到运行时全部能力，并提供离屏渲染到 PNG 的便捷入口"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deer-log.workspace = true
deer-core.workspace = true
deer-gpu.workspace = true
deer-vk.workspace = true
# LY2：文本栈（TextEngine / FontMeasure / Rasterizer / GlyphAtlas / …）来自 L1 TextServer crate。
deer-text.workspace = true
# 窗口层是**可选**的：只有开 `window` feature 才会把 winit 拉进来，
# 这样「只用离屏渲染 / 布局」的使用者不会被动拿到第三方依赖。
deer-window = { workspace = true, optional = true }

[features]
default = []
# 真窗口预览（M2b）：`cargo run -p deer-gui --features window --example window_preview`
window = ["dep:deer-window"]
# **测试接口（testkit）**：`deer_gui::testing` 模块（见该模块文档）。
#
# 为什么做成 feature 而不是恒编译：它是一个**给测试用的**面（建面 / 输入注入 /
# 像素断言 / CPU↔GPU 对照），生产构建里不该出现。开着它零成本 —— testkit 只用
# 本 workspace 的 crate 与 std，**不引入任何第三方依赖**。
#
# 为什么 `src/lib.rs` 里那段是 `#[cfg(any(test, feature = "testing"))]`：
# `test` 那一支让 `cargo test --workspace`（默认 feature）**自动跑 testkit 自身的单测**
# （否则「testkit 自己有没有护栏」就没人管了）；`feature` 那一支给下游用。
testing = []

[[example]]
name = "window_preview"
required-features = ["window"]

[[example]]
name = "hal_window_path"
required-features = ["window"]

# M3c：上屏像素 vs CPU 的逐像素对照（读回最后一帧）。同样是窗口路径 ⇒ 必须要 window feature，
# 也必须是 example 而不是 `#[test]`（winit 要求主线程，见 hal_window_path.rs 的说明）。
[[example]]
name = "window_parity"
required-features = ["window"]

# M5-4：输入 → 命中 → 状态 → 重绘的闭环（真窗口 + 脚本化重放）。窗口路径 ⇒ 要 window feature；
# 必须显式写 `required-features`，否则默认（无 feature）构建会去编译它而失败
# —— 那不是「跳过」，是 `cargo test --workspace` 直接红。
[[example]]
name = "interactive_form"
required-features = ["window"]

# T3.2b：惯性滚动的窗口接线（推进 + 拉式唤醒 + 点轨道跳转的参考实现）。
# 窗口路径 ⇒ 必须显式写 required-features，否则默认（无 feature）构建会去编译它而失败
# —— 那不是「跳过」，是 `cargo test --workspace` 直接红（理由与 interactive_form 那段逐字相同）。
[[example]]
name = "scroll_inertia_window"
required-features = ["window"]

# 上手教程的主角（`docs/GETTING-STARTED-UI.md`）：最小但有真功能的交互界面。
# 同样是窗口路径 ⇒ 必须显式写 `required-features`，否则 `cargo test --workspace` 直接红
# （理由与上面 interactive_form 那段逐字相同）。
[[example]]
name = "counter"
required-features = ["window"]

# 「我已经有一棵界面树，怎么一步步变成有窗口的界面」的最小样板
# （配套 `docs/GETTING-STARTED-UI-STEPS.md`）。同样是窗口路径 ⇒ 必须显式写
# `required-features`，否则默认（无 feature）构建会去编译它而失败 —— 那不是「跳过」，
# 是 `cargo test --workspace` 直接红（理由与上面 interactive_form 那段逐字相同）。
[[example]]
name = "hello_window"
required-features = ["window"]

# AF-2：剪贴板探针（真窗口 + 真 OS 剪贴板的往返保真判据，含中文/emoji 多字节）。
# 写入必须用**真实窗口**作属主（NULL 属主 ⇒ SetClipboardData 按 Win32 语义失败），
# 所以是 example 不是 #[test]（理由与 input_probe 那条先例相同：CI 无桌面）。
# 同样是窗口路径 ⇒ 必须显式写 `required-features`（理由与上面那段逐字相同）。
[[example]]
name = "clipboard_probe"
required-features = ["window"]

# testkit 的**可运行示例**（`docs/features/testing.md` 的最小示例的「跑起来」版）。
# 它需要 `testing` feature ⇒ 必须显式写 `required-features`，否则默认（无 feature）
# 构建会去编译它而失败 —— 那不是「跳过」，是 `cargo test --workspace` 直接红
# （理由与上面 interactive_form 那段逐字相同）。
[[example]]
name = "testkit_demo"
required-features = ["testing"]

# M6 5a：基础控件（Btn 语义 / RowActions / Keep）的自检示例。它用 testkit 注入输入
# 并断言状态（离屏，不开窗口）⇒ 需要 `testing` feature ⇒ 必须显式写 `required-features`，
# 否则默认（无 feature）构建会去编译它而失败 —— 那不是「跳过」，是 `cargo test --workspace`
# 直接红（理由与上面 testkit_demo 那段逐字相同）。
[[example]]
name = "m6_basics"
required-features = ["testing"]

[lib]
name = "deer_gui"
path = "src/lib.rs"
