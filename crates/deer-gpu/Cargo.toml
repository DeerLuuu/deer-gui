[package]
name = "deer-gpu"
description = "deer-gui 的 GPU 硬件抽象层（HAL）：**不依赖任何图形库**，定义后端必须实现的契约"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "deer_gpu"
path = "src/lib.rs"

[dependencies]
deer-log.workspace = true
deer-core.workspace = true
# LY2：文本栈（font/glyph/raster/atlas/text/measure）物理迁到 L1 crate `deer-text`。
# 依赖方向单向：deer-gpu → deer-text → deer-core。
deer-text.workspace = true
